<style>
:root{--cream:#FBF8F6;--blush:#F5EBE9;--rose:#C5798F;--rose-dark:#A05872;--rose-light:#EFD0DA;--gold:#C4A87A;--dark:#2C1F1A;--mid:#7A625C;--light:#EDE4DF;--white:#FFFFFF;--shadow:0 2px 14px rgba(44,31,26,.08);--shadow-lg:0 8px 32px rgba(44,31,26,.14);--r:14px;--rs:10px;--nav-h:68px;--hdr-h:66px;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{font-size:16px;height:100%;overflow:hidden;background:var(--cream);}
body{font-family:'Nunito',sans-serif;background:var(--cream);color:var(--dark);height:100%;overflow:hidden;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;}
h1,h2,h3,h4{font-family:'Cormorant Garamond',serif;font-weight:400;line-height:1.2;}
/* HEADER */
#app-header{flex-shrink:0;height:var(--hdr-h);background:var(--white);border-bottom:1px solid var(--light);display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:100;box-shadow:0 1px 8px rgba(44,31,26,.05);}
.h-logo{display:flex;align-items:center;gap:10px;}
.h-logo svg{width:42px;height:42px;flex-shrink:0;}
.logo-text{display:flex;flex-direction:column;line-height:1.1;}
.logo-the{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:.72rem;color:var(--rose);letter-spacing:1.5px;}
.logo-name{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:1.05rem;color:var(--dark);letter-spacing:2.5px;text-transform:uppercase;}
#hdr-title{font-family:'Cormorant Garamond',serif;font-size:1rem;color:var(--mid);font-style:italic;}
/* BOTTOM NAV */
#bottom-nav{flex-shrink:0;height:calc(var(--nav-h)+env(safe-area-inset-bottom,0px));background:var(--white);border-top:1px solid var(--light);display:flex;z-index:100;box-shadow:0 -1px 8px rgba(44,31,26,.05);padding-bottom:env(safe-area-inset-bottom,0px);}
.nav-tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:none;background:none;color:var(--mid);font-family:'Nunito',sans-serif;font-size:.6rem;font-weight:600;letter-spacing:.5px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:color .2s;padding:6px 2px;}
.nav-tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
.nav-tab.active{color:var(--rose);}
/* MAIN */
#main-content{padding:14px 14px 24px;}
.section{display:none;}
.section.active{display:block;}
/* CARDS */
.card{background:var(--white);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;margin-bottom:10px;}
.card-body{padding:14px;}
/* PATIENT LIST ITEM */
.p-item{background:var(--white);border-radius:var(--rs);padding:13px 14px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .15s;}
.p-item:active{transform:scale(.98);}
.p-name{font-family:'Cormorant Garamond',serif;font-size:1.08rem;font-weight:500;}
.p-region{font-size:.78rem;color:var(--mid);margin-top:2px;}
.p-meta{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex-shrink:0;margin-left:10px;}
.p-sess{font-size:.72rem;color:var(--rose);font-weight:700;}
.p-price{font-size:.72rem;color:var(--gold);font-weight:600;}
/* SEARCH */
.search-wrap{position:relative;margin-bottom:14px;}
.search-input{width:100%;padding:11px 14px 11px 40px;border:1.5px solid var(--light);border-radius:var(--rs);background:var(--white);font-family:'Nunito',sans-serif;font-size:.88rem;color:var(--dark);outline:none;transition:border-color .2s;}
.search-input:focus{border-color:var(--rose-light);}
.search-ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;stroke:var(--mid);fill:none;stroke-width:1.8;stroke-linecap:round;}
/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:5px;padding:9px 16px;border-radius:var(--rs);border:none;cursor:pointer;font-family:'Nunito',sans-serif;font-size:.82rem;font-weight:700;transition:opacity .2s,transform .15s;-webkit-tap-highlight-color:transparent;letter-spacing:.2px;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--rose);color:var(--white);}
.btn-secondary{background:var(--light);color:var(--dark);}
.btn-ghost{background:transparent;color:var(--rose);padding:7px 10px;}
.btn-danger{background:#FEEAEA;color:#C04040;}
.btn-sm{padding:6px 11px;font-size:.78rem;}
.btn-ico{padding:7px;border-radius:8px;background:var(--light);color:var(--mid);}
.btn-ico svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;display:block;}
.btn-fab{position:fixed;bottom:calc(var(--nav-h)+14px);right:14px;width:50px;height:50px;border-radius:50%;background:var(--rose);color:var(--white);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-lg);z-index:90;-webkit-tap-highlight-color:transparent;}
.btn-fab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;}
/* SECTION HEADER */
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.sec-title{font-family:'Cormorant Garamond',serif;font-size:1.4rem;}
.hdr-btns{display:flex;gap:7px;}
/* PATIENT CARD */
.pc-header{background:linear-gradient(135deg,var(--blush) 0%,var(--white) 100%);padding:18px 14px;border-radius:var(--r);margin-bottom:10px;box-shadow:var(--shadow);}
.pc-name{font-family:'Cormorant Garamond',serif;font-size:1.75rem;color:var(--dark);}
.pc-region{font-size:.83rem;color:var(--rose);font-weight:700;margin-top:4px;}
.pc-price{font-size:.83rem;color:var(--gold);font-weight:600;margin-top:2px;}
.pc-actions{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap;}
/* SESSION TABLE */
.tbl-wrap{overflow-x:auto;border-radius:var(--rs);box-shadow:var(--shadow);}
.sess-tbl{width:100%;border-collapse:collapse;font-size:.8rem;background:var(--white);}
.sess-tbl th{background:var(--blush);padding:9px 8px;text-align:left;font-weight:700;color:var(--mid);white-space:nowrap;font-size:.72rem;text-transform:uppercase;letter-spacing:.5px;}
.sess-tbl td{padding:9px 8px;border-bottom:1px solid var(--light);vertical-align:middle;}
.sess-tbl tr:last-child td{border-bottom:none;}
.sess-tbl tr.nc{opacity:.45;}
.sess-tbl tr.nc td{color:var(--mid);font-style:italic;}
.act-cell{display:flex;gap:4px;white-space:nowrap;}
/* FORMS */
.fg{margin-bottom:12px;}
.fl{display:block;font-size:.75rem;font-weight:700;color:var(--mid);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px;}
.fi,.fs,.fta{width:100%;padding:10px 13px;border:1.5px solid var(--light);border-radius:var(--rs);background:var(--white);font-family:'Nunito',sans-serif;font-size:.88rem;color:var(--dark);outline:none;transition:border-color .2s;appearance:none;}
.fi:focus,.fs:focus,.fta:focus{border-color:var(--rose-light);}
.fta{resize:vertical;min-height:72px;}
.fi[type=checkbox]{width:auto;padding:0;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
/* MODAL */
#modal-overlay{display:none;position:fixed;inset:0;background:rgba(44,31,26,.45);z-index:200;align-items:flex-end;justify-content:center;}
#modal-overlay.open{display:flex;}
.modal{background:var(--white);border-radius:var(--r) var(--r) 0 0;width:100%;max-width:600px;max-height:92vh;overflow-y:auto;padding:18px 16px 30px;animation:slideUp .28s ease;}
@keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
.modal-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.modal-title{font-family:'Cormorant Garamond',serif;font-size:1.35rem;}
.modal-close{background:var(--light);border:none;border-radius:50%;width:30px;height:30px;cursor:pointer;font-size:1rem;color:var(--mid);display:flex;align-items:center;justify-content:center;}
/* STATS */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px;}
.stat-card{background:var(--white);border-radius:var(--rs);padding:12px;box-shadow:var(--shadow);text-align:center;}
.stat-val{font-family:'Cormorant Garamond',serif;font-size:1.65rem;color:var(--rose);line-height:1;}
.stat-lbl{font-size:.68rem;color:var(--mid);margin-top:4px;text-transform:uppercase;letter-spacing:.4px;font-weight:700;}
.chart-wrap{background:var(--white);border-radius:var(--rs);padding:14px;box-shadow:var(--shadow);margin-bottom:14px;}
/* FILTER TABS */
.ftabs{display:flex;background:var(--light);border-radius:var(--rs);padding:3px;margin-bottom:13px;gap:2px;}
.ftab{flex:1;padding:7px 4px;border:none;border-radius:8px;background:transparent;cursor:pointer;font-family:'Nunito',sans-serif;font-size:.74rem;font-weight:700;color:var(--mid);transition:all .2s;}
.ftab.active{background:var(--white);color:var(--rose);box-shadow:var(--shadow);}
/* FILTER FORM */
.filter-form{background:var(--white);border-radius:var(--rs);padding:12px;box-shadow:var(--shadow);margin-bottom:14px;display:none;}
.filter-form.open{display:block;}
/* PRICE TABLE */
.ptbl{width:100%;border-collapse:collapse;}
.ptbl tr{border-bottom:1px solid var(--light);}
.ptbl tr:last-child{border-bottom:none;}
.ptbl td{padding:11px 8px;font-size:.86rem;}
.ptbl .rname{color:var(--dark);font-weight:500;}
.ptbl .rprice{color:var(--rose);font-weight:700;text-align:right;}
.ptbl .ract{text-align:right;}
/* NOTES BOX */
.notes-box{background:var(--blush);border-radius:var(--rs);padding:11px 13px;font-size:.83rem;color:var(--mid);margin-bottom:10px;border-left:3px solid var(--rose);}
/* EMPTY */
.empty{text-align:center;padding:44px 20px;color:var(--mid);}
.empty svg{width:44px;height:44px;stroke:var(--rose-light);fill:none;stroke-width:1;margin-bottom:14px;}
/* BACK */
.back-btn{display:inline-flex;align-items:center;gap:7px;color:var(--rose);font-weight:700;font-size:.82rem;cursor:pointer;background:none;border:none;padding:0;margin-bottom:14px;-webkit-tap-highlight-color:transparent;}
.back-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.2;}
/* DIVIDER */
.dvdr{height:1px;background:var(--light);margin:14px 0;}
/* INSTAGRAM */
.ig-link{display:flex;align-items:center;justify-content:center;gap:7px;color:var(--mid);text-decoration:none;font-size:.8rem;padding:20px 16px 6px;margin-top:4px;transition:color .2s;}
.ig-link:hover,.ig-link:active{color:var(--rose);}
/* CONFIG */
.cfg-sec{margin-bottom:22px;}
.cfg-sec-title{font-family:'Cormorant Garamond',serif;font-size:1.15rem;color:var(--dark);margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--light);}
.proc-item{background:var(--white);border-radius:var(--rs);padding:11px 13px;margin-bottom:7px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow);}
.proc-name{font-weight:600;font-size:.88rem;}
.proc-price{color:var(--rose);font-weight:700;font-size:.88rem;}
/* TOAST */
#toast{position:fixed;bottom:calc(var(--nav-h)+14px);left:50%;transform:translateX(-50%) translateY(120px);opacity:0;background:var(--dark);color:var(--white);padding:9px 20px;border-radius:30px;font-size:.82rem;font-weight:600;z-index:500;transition:transform .28s ease,opacity .28s ease;white-space:nowrap;box-shadow:var(--shadow-lg);pointer-events:none;}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
/* CATALOG LINK */
.cat-link{display:flex;align-items:center;gap:12px;background:linear-gradient(120deg,var(--blush) 0%,#f0d9e2 100%);border:1px solid rgba(197,121,143,.25);border-radius:var(--rs);padding:13px 14px;text-decoration:none;margin-bottom:16px;box-shadow:0 2px 10px rgba(197,121,143,.12);transition:transform .15s,box-shadow .15s;-webkit-tap-highlight-color:transparent;cursor:pointer;}
.cat-link:active{transform:scale(.97);box-shadow:0 1px 5px rgba(197,121,143,.1);}
.cat-link-icon{width:38px;height:38px;background:var(--rose);border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 2px 8px rgba(197,121,143,.3);}
.cat-link-icon svg{width:18px;height:18px;stroke:var(--white);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.cat-link-body{flex:1;min-width:0;}
.cat-link-eyebrow{display:block;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:.68rem;color:var(--rose);letter-spacing:1.2px;margin-bottom:2px;text-transform:lowercase;}
.cat-link-title{display:block;font-family:'Cormorant Garamond',serif;font-size:.98rem;color:var(--dark);font-weight:500;letter-spacing:.3px;}
.cat-link-arr{width:15px;height:15px;flex-shrink:0;stroke:var(--rose);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;opacity:.8;}

.note-tag{display:inline-block;background:#FFF8E8;color:#8A6B30;border-radius:20px;font-size:.7rem;font-weight:700;padding:2px 9px;margin-top:4px;}
/* TABLE ROW DETAIL */
.detail-tbl{width:100%;border-collapse:collapse;font-size:.82rem;}
.detail-tbl th{background:var(--blush);padding:8px;text-align:left;font-weight:700;color:var(--mid);font-size:.72rem;text-transform:uppercase;letter-spacing:.4px;}
.detail-tbl td{padding:9px 8px;border-bottom:1px solid var(--light);}
.detail-tbl tr:last-child td{border-bottom:none;}
/* RESPONSIVE */
@media(min-width:600px){#main-content{max-width:640px;margin:0 auto;}.modal{border-radius:var(--r);max-height:82vh;margin-bottom:0;}#modal-overlay{align-items:center;}}
/* SCROLL ROOT — container que clipa o scrollbar fisicamente */
#scroll-root{flex:1;min-height:0;overflow:hidden;position:relative;}
/* SCROLL INNER — empurra o scrollbar 20px além do clip de scroll-root */
#scroll-inner{position:absolute;top:0;left:0;bottom:0;right:-20px;overflow-y:auto;overflow-x:hidden;padding-right:20px;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;}
</style>
</head>

function fmtD(iso){if(!iso)return'—';const[y,m,d]=iso.split('-');return`${d}/${m}/${y}`;}
function fmtC(v){if(v===null||v===undefined||v==='')return'—';return`R$ ${Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}`;}
function attSess(p){return p.sessions.filter(s=>s.attended&&s.date);}
function newId(k){const id=ST[k]||100;ST[k]=id+1;return id;}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function escH(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function getPt(id){return ST.patients.find(p=>p.id===id);}

// ===== NAVIGATE =====
function navigate(sec,pid){
  const si=document.getElementById('scroll-inner');if(si)si.scrollTop=0;
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  
  if(sec==='ficha'&&pid){
    curPid=pid;
    document.getElementById('sec-ficha').classList.add('active');
    document.querySelector('[data-sec="sumario"]').classList.add('active');
    document.getElementById('hdr-title').textContent='Ficha da Paciente';
    renderFicha();
    return;
  }
  curSec=sec;
  const el=document.getElementById('sec-'+sec);
  if(el)el.classList.add('active');
  const nav=document.querySelector(`[data-sec="${sec}"]`);
  if(nav)nav.classList.add('active');
  const titles={sumario:'Depilação a Laser',stats:'Estatísticas',tabela:'Tabela de Valores',config:'Configurações'};
  document.getElementById('hdr-title').textContent=titles[sec]||'';
  if(sec==='sumario')renderSumario();
  else if(sec==='stats')renderStats();
  else if(sec==='tabela')renderTabela();
  else if(sec==='config')renderConfig();
}

function setSfType(t){sfType=t;renderStats();}

function getFilteredSessions(){
  const out=[];
  for(const p of ST.patients){
    for(const s of p.sessions){
      if(!s.attended||!s.date)continue;
      let ok=false;
      const d=s.date;
      if(sfType==='mes'){const[y,m]=d.split('-');ok=+y===sfYear&&+m===sfMonth;}
      else if(sfType==='sem'){const[y,m]=d.split('-');const sem=+m<=6?1:2;ok=+y===sfYear&&sem===sfSem;}
      else if(sfType==='ano'){ok=d.startsWith(sfYear+'');}
      else if(sfType==='per'){ok=(!sfFrom||d>=sfFrom)&&(!sfTo||d<=sfTo);}
      if(ok)out.push({...s,price:p.price,patName:p.name,patId:p.id});
    }
  }
  return out;
}

function getMonthlyData(sessions){
  const map={};
  for(const s of sessions){
    const[y,m]=s.date.split('-');
    const k=`${y}-${m}`;
    if(!map[k])map[k]={label:`${['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'][+m-1]}/${y}`,value:0};
    map[k].value+=(s.price||0);
  }
  const sorted=Object.entries(map).sort((a,b)=>a[0].localeCompare(b[0]));
  return{labels:sorted.map(e=>e[1].label),values:sorted.map(e=>e[1].value)};
}

function getPatientStats(sessions){
  const map={};
  for(const s of sessions){
    if(!map[s.patId])map[s.patId]={name:s.patName,count:0,rev:0};
    map[s.patId].count++;
    map[s.patId].rev+=(s.price||0);
  }
  return Object.values(map).sort((a,b)=>b.rev-a.rev);
}

// Codifica/decodifica texto Unicode em Base64 (suporta acentos, ★, emojis etc.)
function b64EncodeUnicode(str){
  const bytes=new TextEncoder().encode(str);
  let binary='';
  bytes.forEach(b=>binary+=String.fromCharCode(b));
  return btoa(binary);
}
function b64DecodeUnicode(b64){
  const binary=atob(b64);
  const bytes=new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

function dlDataPDF(){
  const{jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:'p',unit:'mm',format:'a4'});
  const nowStr=new Date().toLocaleString('pt-BR');

  const instr=[
    'Este arquivo é um backup completo dos dados do app, com uma cópia',
    'codificada das informações nas páginas seguintes.',
    '',
    'Para importar em outro dispositivo: abra o app, vá em',
    'Configurações → Importar Backup (PDF) e selecione este arquivo.',
    '',
    'Trate este arquivo com confidencialidade — ele contém dados de pacientes.'
  ];
  let iy=125;
  instr.forEach(l=>{doc.text(l,105,iy,{align:'center'});iy+=6;});

  // --- Páginas de dados codificados ---
  doc.addPage();
  doc.setFont('courier','normal');doc.setFontSize(8);doc.setTextColor(90,90,90);
  const dataStr=JSON.stringify(ST);
  const b64=b64EncodeUnicode(dataStr);
  const chunkSize=90;
  const chunks=[];
  for(let i=0;i<b64.length;i+=chunkSize)chunks.push(b64.slice(i,i+chunkSize));
  const lines=['===TBS-DATA-START==='].concat(chunks,['===TBS-DATA-END===']);

  const marginX=15,marginTop=18,marginBottom=280,lineH=4;
  let y=marginTop;
  doc.setFontSize(7);doc.setTextColor(180,180,180);
  doc.text('Backup de dados — The Beauty Space · Laser (não editar o texto abaixo)',marginX,12);
  doc.setFontSize(8);doc.setTextColor(90,90,90);
  lines.forEach(line=>{
    if(y>marginBottom){
      doc.addPage();
      doc.setFont('courier','normal');doc.setFontSize(7);doc.setTextColor(180,180,180);
      doc.text('Backup de dados — The Beauty Space · Laser (não editar o texto abaixo)',marginX,12);
      doc.setFontSize(8);doc.setTextColor(90,90,90);
      y=marginTop;
    }
    doc.text(line,marginX,y);
    y+=lineH;
  });

  const today=new Date().toISOString().slice(0,10);
  doc.save(`thebeautyspace-backup-${today}.pdf`);

  ST.settings.lastBackupAt=nowStr;
  saveST();
  if(curSec==='config')renderConfig();
  toast('Backup em PDF gerado!');
}

function triggerImportPDF(){
  document.getElementById('importPdfInput').click();
}

async function handleImportPDF(e){
  const file=e.target.files[0];
  if(!file)return;
  if(!window.pdfjsLib){toast('Erro: leitor de PDF não carregado.');e.target.value='';return;}
  try{
    const buf=await file.arrayBuffer();
    const pdf=await pdfjsLib.getDocument({data:buf}).promise;
    let fullText='';
    for(let i=1;i<=pdf.numPages;i++){
      const page=await pdf.getPage(i);
      const content=await page.getTextContent();
      fullText+=content.items.map(it=>it.str).join('\n')+'\n';
    }
    const m=fullText.match(/===TBS-DATA-START===([\s\S]*?)===TBS-DATA-END===/);
    if(!m){toast('Arquivo inválido: dados de backup não encontrados neste PDF.');e.target.value='';return;}
    const b64=m[1].replace(/[^A-Za-z0-9+/=]/g,'');
    let parsed;
    try{
      const jsonStr=b64DecodeUnicode(b64);
      parsed=JSON.parse(jsonStr);
    }catch(err){
      toast('Não foi possível ler os dados deste PDF. O arquivo pode estar corrompido.');
      e.target.value='';return;
    }
    if(!parsed||!Array.isArray(parsed.patients)){
      toast('Arquivo inválido: estrutura de dados incorreta.');
      e.target.value='';return;
    }
    const nPt=parsed.patients.length;
    const nSess=parsed.patients.reduce((s,p)=>s+(p.sessions?p.sessions.length:0),0);
    window._pendingImport=parsed;
    openModal(`
      <div class="modal-hdr"><div class="modal-title">Importar Backup</div><button class="modal-close" onclick="closeModal()">✕</button></div>
      <p style="font-size:.88rem;color:var(--dark);margin-bottom:10px">Foram encontrados <strong>${nPt}</strong> pacientes e <strong>${nSess}</strong> sessões neste arquivo.</p>
      <p style="font-size:.85rem;color:var(--rose-dark);margin-bottom:16px">⚠️ Importar vai substituir TODOS os dados atuais do app neste dispositivo. Essa ação não pode ser desfeita.</p>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
        <button class="btn btn-danger" onclick="confirmImportData()">Substituir Dados</button>
      </div>`);
  }catch(err){
    console.error(err);
    toast('Erro ao ler o PDF. Verifique se é um arquivo de backup válido.');
  }
  e.target.value='';
}

function confirmImportData(){
  if(!window._pendingImport)return;
  ST=window._pendingImport;
  window._pendingImport=null;
  saveST();
  closeModal();
  toast('Dados importados com sucesso!');
  navigate(curSec||'sumario');
}
